    <div class="page-container">
        <div class="page-header">
            <h1 class="page-title">Get In Touch</h1>
            <p class="page-subtitle">Have a project in mind or just want to say hi?</p>
        </div>

        <div class="glass-card" style="max-width: 800px; margin: 0 auto;">
            <form id="contactForm">
                <!-- Form Configuration handled via AJAX in script.js -->

                <div class="form-group" style="margin-bottom: 25px;">
                    <label for="name" style="display: block; margin-bottom: 8px; color: var(--text-muted);">Full
                        Name</label>
                    <input type="text" id="name" name="name" class="form-input" required
                        style="width: 100%; padding: 15px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 10px; color: #fff;"
                        placeholder="Enter your name">
                </div>

                <div class="form-group" style="margin-bottom: 25px;">
                    <label for="email" style="display: block; margin-bottom: 8px; color: var(--text-muted);">Email
                        Address</label>
                    <input type="email" id="email" name="email" class="form-input" required
                        style="width: 100%; padding: 15px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 10px; color: #fff;"
                        placeholder="Enter your email">
                </div>

                <div class="form-group" style="margin-bottom: 25px;">
                    <label for="phone" style="display: block; margin-bottom: 8px; color: var(--text-muted);">Phone
                        Number</label>
                    <input type="tel" id="phone" name="phone" class="form-input" required
                        style="width: 100%; padding: 15px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 10px; color: #fff;"
                        placeholder="Enter your phone number">
                </div>

                <div class="form-group" style="margin-bottom: 30px;">
                    <label for="message"
                        style="display: block; margin-bottom: 8px; color: var(--text-muted);">Message</label>
                    <textarea id="message" name="message" class="form-textarea" required
                        style="width: 100%; padding: 15px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 10px; color: #fff; min-height: 150px;"
                        placeholder="Tell me about your project..."></textarea>
                </div>

                <div class="button-group" style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <button type="submit" class="btn btn-primary"
                        style="flex: 1; border: none; cursor: pointer; justify-content: center;">
                        <span>Send Message</span>
                        <i class="fas fa-paper-plane" style="margin-left: 10px;"></i>
                    </button>
                </div>
            </form>
        </div>
