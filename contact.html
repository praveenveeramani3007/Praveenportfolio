    <section id="contact" class="contact" style="padding-top: 120px;">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">Get In Touch</h2>
                <p class="section-subtitle">Let's build your next web experience</p>
            </div>
            <section class="contact-form">
                <h2>Contact Me</h2>
                <!-- Removed action="save_contact.php" to prevent 405 Error -->
                <form id="contactForm" onsubmit="return false;">
                    <div id="error-msg"></div> <!-- Validation feedback here -->

                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" placeholder="Your full name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Your email" required>

                    <label for="phone">Mobile Number:</label>
                    <input type="tel" id="phone" name="phone" placeholder="Your mobile number" required>

                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" placeholder="Write your message..."
                        required></textarea>


                    <div class="form-actions">
                        <button type="button" id="smsBtn">Send Message (SMS)</button>
                        <button type="button" id="whatsappBtn">
                            <i class="fab fa-whatsapp"></i> Send via WhatsApp
                        </button>
                    </div>
                </form>

                <script>
                    const myPhoneNumber = "916374416934"; // Your number
                    const errorMsg = document.getElementById('error-msg');

                    function showError(msg) {
                        errorMsg.textContent = msg;
                        errorMsg.style.display = 'block';
                        setTimeout(() => {
                            errorMsg.textContent = '';
                        }, 5000);
                    }

                    function getFormData() {
                        const name = document.getElementById('name').value;
                        const email = document.getElementById('email').value;
                        const phone = document.getElementById('phone').value;
                        const message = document.getElementById('message').value;

                        if (!name) {
                            showError('Please enter your name.');
                            return null;
                        }
                        if (!email) {
                            showError('Please enter your email.');
                            return null;
                        }
                        if (!phone) {
                            showError('Please enter your phone number.');
                            return null;
                        }
                        if (!message) {
                            showError('Please enter a message.');
                            return null;
                        }

                        return { name, email, phone, message };
                    }

                    // Handle WhatsApp
                    document.getElementById('whatsappBtn').addEventListener('click', function () {
                        const data = getFormData();
                        if (!data) return;

                        const text = `Name: ${data.name}%0AEmail: ${data.email}%0APhone: ${data.phone}%0AMessage: ${data.message}`;
                        const url = `https://wa.me/${myPhoneNumber}?text=${text}`;
                        window.open(url, '_blank');
                    });

                    // Handle SMS
                    document.getElementById('smsBtn').addEventListener('click', function () {
                        const data = getFormData();
                        if (!data) return;

                        // iOS uses '&' for body, Android uses '?' usually, but '?' works for most as query param starter.
                        // For broader compatibility we use explicit checks or standard body param.
                        // Standard: sms:+123?body=...

                        const body = `Name: ${data.name}\nEmail: ${data.email}\nPhone: ${data.phone}\nMessage: ${data.message}`;
                        const encodedBody = encodeURIComponent(body);

                        window.location.href = `sms:+${myPhoneNumber}?body=${encodedBody}`;
                    });
                </script>
